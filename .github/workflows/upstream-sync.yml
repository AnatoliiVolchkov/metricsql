name: Upstream sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only detect and test-merge upstream changes, do not push or open a pull request.
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          fetch-depth: 0
          ref: main
          # GITHUB_TOKEN cannot push merges that change .github/workflows, SYNC_TOKEN can.
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Merge upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          UPSTREAM_URL: https://github.com/VictoriaMetrics/metricsql.git
          UPSTREAM_BRANCH: master
          BASE_BRANCH: main
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TEST_CMD: go vet ./... && go test -count=1 ./... && go test -count=1 -race ./...
        run: bash .github/scripts/upstream-sync.sh
